name: Tests

# Runs the tests for pull requests (e.g. from Dependabot) and pushes to other
# branches. Uses GitHub's own runners on purpose: anyone can open a pull request
# on a public repository, so this must never run on the self-hosted server.
on:
  pull_request:
  push:
    branches-ignore:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
