  env-files:
    runs-on: [self-hosted, webmin]
    name: Create env files
#    needs: [trivy-scan]
    needs: [build]
    steps:
      - name: Create env file for front
        # Secrets are only given to this step, and the file is readable by the runner user only
        env:
          DISCORD_ALL: ${{ secrets.DISCORD_ALL }}
          DISCORD_WEBHOOK_REFLECTION: ${{ secrets.DISCORD_WEBHOOK_REFLECTION }}
          DISCORD_WEBHOOK_LETTER: ${{ secrets.DISCORD_WEBHOOK_LETTER }}
          DISCORD_WEBHOOK_SYMBOL: ${{ secrets.DISCORD_WEBHOOK_SYMBOL }}
          DISCORD_WEBHOOK_AURIC: ${{ secrets.DISCORD_WEBHOOK_AURIC }}
        run: |
          umask 077
          {
            echo "DISCORD_ALL=$DISCORD_ALL"
            echo "DISCORD_WEBHOOK_REFLECTION=$DISCORD_WEBHOOK_REFLECTION"
            echo "DISCORD_WEBHOOK_LETTER=$DISCORD_WEBHOOK_LETTER"
            echo "DISCORD_WEBHOOK_SYMBOL=$DISCORD_WEBHOOK_SYMBOL"
            echo "DISCORD_WEBHOOK_AURIC=$DISCORD_WEBHOOK_AURIC"
          } > .env
          chmod 600 .env

  deploy:
    runs-on: [self-hosted, webmin]
    name: Deploy to swarm, cleanup and post notification
    needs: env-files
    steps:
      - name: Deploy
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: docker compose -f docker-compose-prod.yaml up -d

# This seems to causing issues after we moved from kubernetes to Docker
#      - name: Clean up
#        if: always()
#        run: |
#          rm -f .env

      - name: Post status notification to Discord
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        if: always()
        with:
          title: "TML-NFT-BOT build and push"
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
