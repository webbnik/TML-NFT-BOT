name: Build TML-NFT-BOT Docker

on:
  push:
    branches:
      - master

# The workflow only needs to read the repository
permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, webmin]
    name: Test and build container
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        # Builds the "test" stage of the Dockerfile, which fails if a test fails
        run: |
          docker build --target test --tag tml-nft-bot-test:${{ github.sha }} .
          docker image rm tml-nft-bot-test:${{ github.sha }}

      - name: Build container
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: docker compose -f docker-compose-prod.yaml build

  env-files:
    runs-on: [self-hosted, webmin]
    name: Create env files
    needs: [build]
    steps:
      - name: Create env file for front
        # Secrets are only given to this step, and the file is readable by the runner user only
        env:
          DISCORD_ALL: ${{ secrets.DISCORD_ALL }}
          DISCORD_WEBHOOK_REFLECTION: ${{ secrets.DISCORD_WEBHOOK_REFLECTION }}
          DISCORD_WEBHOOK_LETTER: ${{ secrets.DISCORD_WEBHOOK_LETTER }}
          DISCORD_WEBHOOK_SYMBOL: ${{ secrets.DISCORD_WEBHOOK_SYMBOL }}
          DISCORD_WEBHOOK_AURIC: ${{ secrets.DISCORD_WEBHOOK_AURIC }}
        run: |
          umask 077
          {
            echo "DISCORD_ALL=$DISCORD_ALL"
            echo "DISCORD_WEBHOOK_REFLECTION=$DISCORD_WEBHOOK_REFLECTION"
            echo "DISCORD_WEBHOOK_LETTER=$DISCORD_WEBHOOK_LETTER"
            echo "DISCORD_WEBHOOK_SYMBOL=$DISCORD_WEBHOOK_SYMBOL"
            echo "DISCORD_WEBHOOK_AURIC=$DISCORD_WEBHOOK_AURIC"
          } > .env
          chmod 600 .env

  deploy:
    runs-on: [self-hosted, webmin]
    name: Deploy
    needs: env-files
    steps:
      - name: Deploy
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: docker compose -f docker-compose-prod.yaml up -d

  notify:
    runs-on: [self-hosted, webmin]
    name: Post status notification
    # Runs after everything, also when the tests or the deploy failed
    needs: [build, env-files, deploy]
    if: always()
    steps:
      - name: Post status notification to Discord
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1.16.0
        with:
          title: "TML-NFT-BOT build and push"
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
