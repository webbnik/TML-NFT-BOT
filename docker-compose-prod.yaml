services:
  tml-nft-bot:
    build:
      context: ./
      target: production
    image: tml-nft-bot:${GITHUB_SHA}
    container_name: tml-nft-bot
    restart: always
    ports:
      - 127.0.0.1:8457:8000
    environment:
      PYTHONUNBUFFERED: 1
    # Webhooks are passed as environment variables; the file itself is not mounted
    env_file:
      - .env
    volumes:
      # Database (incl. price history) and downloaded artwork survive deploys
      - tml-nft-data:/app/instance
    networks:
      - tml_network

volumes:
  tml-nft-data:
    name: tml-nft-data

networks:
  tml_network:
