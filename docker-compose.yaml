# Local development: code is mounted into the container and reloaded on change.
# Start with: docker compose up --build   (then open http://localhost:8459)
services:
  tml-nft-bot:
    build:
      context: ./
      target: production
    image: tml-nft-bot:dev
    container_name: tml-nft-bot-dev
    volumes:
      - ./:/app
    ports:
      - 127.0.0.1:8459:8000
    command: ["gunicorn", "-b", "0.0.0.0:8000", "-w", "2", "--timeout", "10", "--reload", "--preload", "app:app"]
    environment:
      FLASK_ENV: "development"
      PYTHONUNBUFFERED: 1
