<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loading · Tomorrowland NFTs</title>
    <script>
        try {
            const theme = JSON.parse(localStorage.getItem('tml.theme'));
            if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        } catch (e) { }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nft.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
</head>

<body>
    <main class="loading">
        <div>
            <div class="spinner" aria-hidden="true"></div>
            <h1>Fetching the latest prices…</h1>
            <p>This should not take more than a minute. The page reloads by itself.</p>
            <p>Still stuck? Contact <a href="mailto:nft@hardy.se">nft@hardy.se</a> or ask on
                <a href="https://discord.gg/WGYaCcApvQ" target="_blank" rel="noopener noreferrer">Discord</a>.</p>
            <p><a href="/">Reload now</a></p>
        </div>
    </main>
    <script>
        setTimeout(() => { window.location.href = '/'; }, 5000);
    </script>
</body>

</html>
